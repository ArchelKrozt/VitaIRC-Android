name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # the runner image already has the Android SDK (ANDROID_HOME)

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vitairc.jks"
          echo "VITAIRC_KEYSTORE=$RUNNER_TEMP/vitairc.jks" >> "$GITHUB_ENV"
          echo "VITAIRC_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Tests
        run: ./build.sh testReleaseUnitTest

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VitaIRC-Android
          path: dist/VitaIRC.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VitaIRC.apk
          generate_release_notes: true
